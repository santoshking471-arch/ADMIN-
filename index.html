<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<style>
  /* 1. Mobile Best Practices */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f0f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* 2. Slim Card Design */
  .login-card {
    width: 90%;
    max-width: 400px;
    background: #ffffff;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  h2 { margin: 0 0 20px 0; font-size: 20px; color: #1f1f1f; text-align: center; }

  /* 3. Slim Android Inputs */
  input {
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 16px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px; /* 16px prevents auto-zoom on iOS/Android */
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: #1a73e8;
    background-color: #f8fbff;
  }

  /* 4. Action Button */
  button {
    width: 100%;
    padding: 14px;
    background-color: #1a73e8;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3);
    transition: background 0.2s;
  }

  button:active {
    background-color: #1557b0;
    transform: scale(0.98);
  }
</style>


<h2>Admin Login 🔐</h2>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCA49EYDbqUnYu1sXs0ETDMIGaWxtoxXOM",
  authDomain: "reselling-store-c103e.firebaseapp.com",
  databaseURL: "https://reselling-store-c103e-default-rtdb.firebaseio.com",
  projectId: "reselling-store-c103e",
  storageBucket: "reselling-store-c103e.firebasestorage.app",
  messagingSenderId: "411682468136",

firebase.initializeApp(firebaseConfig);

function login(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  // 🔥 Only allowed emails
if (email !== "santoshking471@gmail.com" && email !== "sidarrani368@gmail.com") {
    alert("Access Denied ❌");
    return;
}


  firebase.auth().signInWithEmailAndPassword(email, pass)
  .then(()=>{
    window.location.href = "home.html";
  })
  .catch(()=>{
    alert("Login Failed 😢");
  });
}
</script>

</body>
</html>
