<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .login-card { width: 85%; max-width: 340px; background: rgba(255, 255, 255, 0.98); padding: 25px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; }
    .login-card h2 { margin: 0 0 15px 0; color: #0b2e6f; font-size: 20px; }
    #errorMsg { color: #d93025; font-size: 12px; font-weight: bold; margin-bottom: 10px; min-height: 15px; }
    .login-card input { width: 100%; padding: 12px 15px; margin: 6px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; outline: none; user-select: text; }
    .login-card button { width: 100%; padding: 12px; margin: 15px 0 10px 0; border-radius: 8px; border: none; background-color: #0b2e6f; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
    .register-link { color: #0b2e6f; text-decoration: none; display: block; margin-bottom: 20px; font-size: 13px; }
    .helpline { display: flex; gap: 8px; }
    .helpline a { flex: 1; padding: 8px; border-radius: 6px; text-decoration: none; color: #fff; font-size: 11px; font-weight: bold; }
    .footer-text { font-size: 11px; color: #666; margin-top: 15px; }
</style>
</head>
<body>


<h2>Admin Login 🔐</h2>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCA49EYDbqUnYu1sXs0ETDMIGaWxtoxXOM",
  authDomain: "reselling-store-c103e.firebaseapp.com",
  databaseURL: "https://reselling-store-c103e-default-rtdb.firebaseio.com",
  projectId: "reselling-store-c103e",
  storageBucket: "reselling-store-c103e.firebasestorage.app",
  messagingSenderId: "411682468136",
  appId: "1:411682468136:web:79cc2b622148f42a62e01d"
};

firebase.initializeApp(firebaseConfig);

function login(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  // 🔥 Only allowed emails
if (email !== "santoshking471@gmail.com" && email !== "sidarrani368@gmail.com") {
    alert("Access Denied ❌");
    return;
}


  firebase.auth().signInWithEmailAndPassword(email, pass)
  .then(()=>{
    window.location.href = "home.html";
  })
  .catch(()=>{
    alert("Login Failed 😢");
  });
}
</script>

</body>
</html>
