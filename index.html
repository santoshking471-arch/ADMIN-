<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display: flex; justify-content: center; align-items: center; }
    
    .login-card { 
      width: 90%; 
      max-width: 320px; 
      background: rgba(255, 255, 255, 0.98); 
      padding: 25px; 
      border-radius: 15px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
      text-align: center; 
    }
    
    .login-card h2 { margin: 0 0 20px 0; color: #0b2e6f; font-size: 20px; }
    
    .login-card input { 
      width: 100%; 
      padding: 10px; 
      margin-bottom: 12px; /* Ek ke niche ek set karne ke liye */
      border-radius: 6px; 
      border: 1px solid #ccc; 
      font-size: 14px; 
      outline: none; 
    }
    
    .login-card button { 
      width: 100%; 
      padding: 10px; 
      border-radius: 6px; 
      border: none; 
      background-color: #0b2e6f; 
      color: #fff; 
      font-size: 15px; 
      font-weight: bold; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Admin Login 🔐</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCA49EYDbqUnYu1sXs0ETDMIGaWxtoxXOM",
  authDomain: "reselling-store-c103e.firebaseapp.com",
  databaseURL: "https://reselling-store-c103e-default-rtdb.firebaseio.com",
  projectId: "reselling-store-c103e",
  storageBucket: "reselling-store-c103e.firebasestorage.app",
  messagingSenderId: "411682468136",
  appId: "1:411682468136:web:79cc2b622148f42a62e01d"
};

firebase.initializeApp(firebaseConfig);

function login(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  if (email !== "santoshking471@gmail.com" && email !== "sidarrani368@gmail.com") {
    alert("Access Denied ❌");
    return;
  }

  firebase.auth().signInWithEmailAndPassword(email, pass)
  .then(()=>{
    window.location.href = "home.html";
  })
  .catch(()=>{
    alert("Login Failed 😢");
  });
}
</script>

</body>
</html>
